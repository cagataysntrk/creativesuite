title: dima ilk dönemi
rationale: >
  dima, Upcytech'in şirket beyni ürünü. Ayrı marka ekseni açılıyor çünkü ürünün
  kendi personası, kendi kanalı ve kendi kanıt seti olacak — Upcytech kayıtlarıyla
  aynı havuzda durursa retrieval ikisini karıştırır ve "asla sızmaz" vaadi çöker.
  Pazara nasıl sunulacağı (onaylı marka "dima by Upcytech" mi, bağımsız mı) VERİ
  MODELİNİ değiştirmez — o karar kullanıcının, D-84'te açıkça bırakıldı.
