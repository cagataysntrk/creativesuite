# ⚠ ⚠ EMEKLİ (2026-08-18) — yerine `instagram-karosel` (D-268 · FAZ-15.9).
#
# Bu hat karoseli SLAYT BAŞINA render ediyor ve tasarımı `AileProfili` seçiyor. Deney
# gösterdi ki o yaklaşım yedi TASARIM değil tek tasarımın yedi BOYASI üretiyor; ayrıca
# süreklilik ima edilmekten öteye geçemiyor (her slayt ayrı tuval). Gerekçe ve ölçümler:
# `docs/arsiv/aile-tabanli-karosel/README.md`.
#
# ⚠ SİLİNMEDİ, çünkü emeklilik silme değildir (Yasa 10): `apps/ui` bu id'ye bağlı ve
# FAZ-3.14 (bloke, `2.9` bekliyor) onu hedefliyor. Yeni karosel işleri
# `instagram-karosel` hattına gider.
#
# Instagram carousel (§10 · FAZ-3.14).
#
# MODEL ADI YOK (R-40): adımlar YETENEK ister. Taşan içerik otomatik BÖLÜNÜR ve her
# slayt kendi PNG'si olur — küçültme yok (§7.1), çünkü Türkçe'de tipi küçültmek
# okunabilirliği İngilizce'dekinden hızlı bitirir.
id: instagram-carousel
title: Instagram carousel

steps:
  - id: cozumle
    verb: RESOLVE

  - id: bilgi-sec
    verb: SELECT
    needs: [cozumle]

  # Görsel adımı İSTEĞE BAĞLI: arka plan üretilemezse slayt düz zeminle render edilir
  # ve bu MEŞRU bir çıktıdır — "bedava ve premium çıktı tipografide aynıdır" (§8.2)
  # zaten görselin taşıyıcı olmadığını söylüyor. Zorunlu saymak, anahtarı olmayan bir
  # kurulumda hattın hiç koşmaması demekti.
  - id: gorsel-uret
    verb: GENERATE
    capability: image.generate
    needs: [bilgi-sec]
    constraints:
      aspect: '4:5'
      # Görsel modeline Türkçe metin çizdirilmez (R-20) — metin kompozitte gelir.
      no_text: true
      max_cost_usd_micros: 60000
      optional: true

  - id: kompozit
    verb: COMPOSE
    needs: [bilgi-sec, gorsel-uret]
    constraints:
      width: 1080
      height: 1350

  - id: render
    verb: RENDER
    # Yetenek YOK: render YÖNLENDİRİLMEZ. R-30 tek motor diyor ve bir motoru "seçmek",
    # ikinci bir motorun var olabileceğini varsayar (D-122).
    needs: [kompozit]
    constraints:
      width: 1080
      height: 1350

  - id: kalite
    verb: VALIDATE
    needs: [render]

  - id: onay
    verb: PROPOSE
    needs: [kalite]
    gate: insan-onayi

  # ⚠ FAZ-7 denetimi 2. tur (B1): `PUBLISH` fiil haritasındaydı ama **hiçbir hat onu
  # çağırmıyordu** — `grep -rn PUBLISH registry/` sıfır satır veriyordu. D-216'nın
  # (`INGEST`) dersi bir seviye yukarıda tekrarladı: gövde yazıldı, harita dolduruldu,
  # HATTI yazan olmadı. "Çağıran var mı" sorusu tek adım için değil, ZİNCİR için
  # sorulmalı.
  #
  # `needs: [onay]` — yayın **onaydan sonra**. Kapı geçilmediyse bu adım hiç koşmaz;
  # insan onayı bir yan etki değil, bir kapıdır (§4.1b).
  - id: yayinla
    verb: PUBLISH
    needs: [onay]
    constraints:
      platform: instagram
