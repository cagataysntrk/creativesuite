# Instagram karoseli — KATALOG MERKEZLİ (§7.1 · D-268 · FAZ-15).
#
# ⚠ ⚠ **BU HAT, MİMARİNİN ÜRETİM YOLUNA BAĞLANDIĞI YER.** Panorama render'ı, altı
# şablonluk katalog, seçici, uyarlayıcı ve denetim yazıldı ve `renderPanorama`nın
# üretimde TEK BİR ÇAĞIRANI YOKTU: `grep -rn renderPanorama packages/engine` sıfır
# satır veriyordu. Bu depoda aynı sınıf hatanın onuncu tekrarıydı (D-261 ailesi) ve
# en büyüğü — mimarinin tamamı `just uret`ten erişilemez duruyordu. Hat bu dosyayla
# erişilebilir oluyor.
#
# ⚠ **SERBEST ÜRETİM YOK (D-268).** Hat kompozisyon icat etmiyor; katalogdan bir
# şablon SEÇİYOR ve onun DOLU taslağını konuya uyarlıyor. Slayt-başına render yolu
# (`instagram-post`) hâlâ duruyor ve emekliliği ayrı bir adım.
#
# ⚠ MODEL ADI YOK (R-40): adımlar YETENEK ister.
id: instagram-karosel
title: Instagram karoseli — katalog merkezli

steps:
  - id: cozumle
    verb: RESOLVE

  - id: bilgi-sec
    verb: SELECT
    needs: [cozumle]

  # 1) KONU → İÇERİK. Şablon henüz seçilmedi: seçim içeriğin ŞEKLİNE bakıyor ve şekil
  # ancak metin yazıldıktan sonra ölçülebilir. Ters sıra, şablonu konuya göre tahmin
  # etmek olurdu — tahmin edilen bir şablon, içeriğe uymayan bir kompozisyon demek.
  - id: metin-uret
    verb: GENERATE
    capability: text.generate
    needs: [bilgi-sec]
    constraints:
      locale: tr-TR
      max_chars: 2200

  # 2) İÇERİK → ŞABLON SEÇİMİ + UYARLAMA.
  #
  # ⚠ ⚠ **SEÇİM BU ADIMIN İSTEM KURUCUSUNDA, DETERMİNİSTİK KOŞUYOR.** Ayrı bir adıma
  # çıkarmak onuncu bir fiil isterdi (R-02, dokuz fiil kapalı liste). `sablonSec` model
  # çağırmıyor, dosyaya dokunmuyor; `GENERATE`in yan etki sınıfı bozulmuyor.
  # ⚠ Agent SIFIRDAN yazmıyor: katalogdaki dolu taslağı alıp konuya göre düzenliyor.
  # Kompozisyon alanları şemada YOK — değiştiremediği için "değiştirme" demeye gerek yok.
  # ⚠ ⚠ **METİN KAPISI — MALİYETİN ÖNÜNDE.** Kapı `metin-uret`ten SONRA, görsel
  # üretiminden ÖNCE duruyor: metin yanlışsa dört görsel üretmenin anlamı yok ve parası
  # geri gelmiyor. Onay üretimin sonunda değil, harcamanın önünde olmalı (Yasa 2).
  # ⚠ Kapı `sablon-uyarla`da çünkü koşu bir kapıyı GÖRÜNCE DURUR, geçtikten sonra değil:
  # burada durmak, `metin-uret` bitmiş ve okunabilir demektir.
  - id: sablon-uyarla
    verb: GENERATE
    capability: text.generate
    gate: metin-onayi
    needs: [bilgi-sec, metin-uret]
    constraints:
      sablon_uyarla: true
      max_chars: 4000
      # ⚠ Görsel üretilemeyen bir koşuda katalog İKİ kayda iniyor (görselsiz şablonlar).
      # Bunu hattın bilmesi gerek: `sops exec-env` olmadan koşulduğunda kimliği yer
      # tutucudan ibaret bir karosel üretmek yerine seçim daralıyor.
      gorsel_uretilebilir: true

  # 3) UYARLAMA → PANORAMA BELGESİ. Deterministik birleştirme: şablonun kompozisyonu +
  # agentın içeriği. `uyarla` kaynağı boş, örnek işareti kalmış ya da panel tipi
  # değişmiş bir uyarlamayı REDDEDİYOR — reddedilen uyarlama yarı uygulanmıyor.
  - id: kompozit
    verb: COMPOSE
    needs: [metin-uret, sablon-uyarla]
    constraints:
      katalog: true

  # 4) ŞABLONUN İHTİYAÇ DUYDUĞU GÖRSEL. Brief'in sabit kısmı katalog kaydından
  # (`briefTemeli`), konuya özgü kısmı modelden geliyor.
  - id: gorsel-brief
    verb: GENERATE
    capability: text.generate
    needs: [bilgi-sec, kompozit]
    constraints:
      gorsel_brief: true
      max_chars: 600
      optional: true

  - id: gorsel-uret
    verb: GENERATE
    capability: image.generate
    # ⚠ `kompozit` BAĞI ŞART: varyant tablosu şablon kaydında ve şablon kimliği oradan
    # geliyor. Bağ koparsa dört yuva dört ÖZDEŞ fotoğraf alır (gerçek koşu gösterdi).
    needs: [gorsel-brief, kompozit]
    constraints:
      optional: true
      gorsel_sira: 1
      aspect: '4:5'
      no_text: true
      max_cost_usd_micros: 20000

  # 5) ARKA PLAN SİLİNİYOR — kesik özne artık RİCA değil, İŞLEM (D-274 · FAZ-15.11).
  #
  # ⚠ ⚠ **BU ADIM ÜÇ GERÇEK KOŞUNUN ÖLÇÜMÜNDEN DOĞDU.** `matlama` (luma anahtarı)
  # brief'in "düz siyah zemin" ricasına dayanıyordu; model üç koşuda da açık gri stüdyo
  # zemini üretti (köşe parlaklığı 59–101/255) ve çıktıda kesik özne yerine DİKDÖRTGEN
  # fotoğraf kaldı. Denetim kusuru görüyor ama düzeltemiyordu: metin değiştirerek bir
  # görselin zemini siyahlaşmaz.
  #
  # ⚠ Yerel model (BRIA RMBG 2.0), ağa çıkmıyor, maliyet ölçülmüş sıfır. `optional`:
  # sanal ortam kurulmamışsa hat durmuyor — yer tutucu görünür kalıyor.
  - id: gorsel-kirp
    verb: GENERATE
    capability: image.matte
    needs: [gorsel-uret]
    constraints:
      optional: true

  # 5b) SLAYT BAŞINA GÖRSEL — üç adım daha, AÇILARAK (borç A8 · D-278).
  #
  # ⚠ ⚠ **BU ÜÇLÜ, ŞABLONU ASLINA BENZETMENİN ÖNÜNDEKİ KÖK ENGELDİ.** Katalog
  # `adet: 'slayt-basina'` ilan ediyordu, hat TEK görsel üretiyordu ve `composeBody` onu
  # her yuvaya YAYIYORDU: çıktıda aynı figür yan yana duruyor, tasarım değil hata gibi
  # okunuyordu. Yayma kaldırıldığında da sorun bitmedi — üretilecek ikinci görsel yoktu.
  # Ölçüldü: `sahne`nin dört slaydından üçünde doluluk %3–7, yani kadraj boştu.
  #
  # ⚠ **DAG DÖNGÜ TAŞIMIYOR, o yüzden AÇILDI** — `duzelt` ile birebir aynı gerekçe.
  # Tavan 4: kataloğun en çok yuva isteyen şablonu (`donen`) dört istiyor.
  #
  # ⚠ ⚠ **FAZLALIK ADIM PARA HARCAMIYOR.** Şablonun yuvası kadar varyant var; sıra
  # varyant sayısını aşınca brief BOŞ dönüyor ve `gorsel-uret-K` atlanıyor. Yani
  # `editoryal` (2 yuva) koşarken 3. ve 4. görsel adımı hiç model çağırmıyor. Bedel
  # üç boş metin istemi; kazanç, her şablonun kendi yuva sayısınca görsel alması.
  #
  # ⚠ Varyantlar KADRAJI söylüyor (poz, açı, mesafe), konuyu değil: aynı konu + aynı
  # brief + aynı model = aynı kadraj, yani N özdeş görsel.

  - id: gorsel-brief-2
    verb: GENERATE
    capability: text.generate
    needs: [bilgi-sec, kompozit]
    constraints:
      gorsel_brief: true
      gorsel_sira: 2
      max_chars: 600
      optional: true

  - id: gorsel-uret-2
    verb: GENERATE
    capability: image.generate
    # ⚠ `kompozit` BAĞI ŞART: varyant tablosu şablon kaydında ve şablon kimliği oradan
    # geliyor. Bağ koparsa dört yuva dört ÖZDEŞ fotoğraf alır (gerçek koşu gösterdi).
    needs: [gorsel-brief-2, kompozit]
    constraints:
      optional: true
      gorsel_sira: 2
      aspect: '4:5'
      no_text: true
      max_cost_usd_micros: 20000

  - id: gorsel-kirp-2
    verb: GENERATE
    capability: image.matte
    needs: [gorsel-uret-2]
    constraints:
      optional: true

  - id: gorsel-brief-3
    verb: GENERATE
    capability: text.generate
    needs: [bilgi-sec, kompozit]
    constraints:
      gorsel_brief: true
      gorsel_sira: 3
      max_chars: 600
      optional: true

  - id: gorsel-uret-3
    verb: GENERATE
    capability: image.generate
    # ⚠ `kompozit` BAĞI ŞART: varyant tablosu şablon kaydında ve şablon kimliği oradan
    # geliyor. Bağ koparsa dört yuva dört ÖZDEŞ fotoğraf alır (gerçek koşu gösterdi).
    needs: [gorsel-brief-3, kompozit]
    constraints:
      optional: true
      gorsel_sira: 3
      aspect: '4:5'
      no_text: true
      max_cost_usd_micros: 20000

  - id: gorsel-kirp-3
    verb: GENERATE
    capability: image.matte
    needs: [gorsel-uret-3]
    constraints:
      optional: true

  - id: gorsel-brief-4
    verb: GENERATE
    capability: text.generate
    needs: [bilgi-sec, kompozit]
    constraints:
      gorsel_brief: true
      gorsel_sira: 4
      max_chars: 600
      optional: true

  - id: gorsel-uret-4
    verb: GENERATE
    capability: image.generate
    # ⚠ `kompozit` BAĞI ŞART: varyant tablosu şablon kaydında ve şablon kimliği oradan
    # geliyor. Bağ koparsa dört yuva dört ÖZDEŞ fotoğraf alır (gerçek koşu gösterdi).
    needs: [gorsel-brief-4, kompozit]
    constraints:
      optional: true
      gorsel_sira: 4
      aspect: '4:5'
      no_text: true
      max_cost_usd_micros: 20000

  - id: gorsel-kirp-4
    verb: GENERATE
    capability: image.matte
    needs: [gorsel-uret-4]
    constraints:
      optional: true

  # 6) GÖRSEL YUVAYA GİRİYOR — aynı `COMPOSE` gövdesi, bu kez girdisinde görselle.
  #
  # ⚠ ⚠ **BU ADIM GERÇEK BİR KOŞUDAN SONRA EKLENDİ.** İlk sürümde `render` doğrudan
  # `kompozit`e bağlıydı; hat on adımı geçti, görsel ÜRETİLDİ ve çıktıda kesik özne
  # yerine YER TUTUCU çıktı. Sebep sıralamaydı: panorama belgesi görselden ÖNCE
  # kuruluyor ve görselin belgeye dönecek yolu yoktu. `instagram-post` bunu aynı
  # şekilde çözüyor — yeni bir fiil de yeni bir gövde de gerekmedi.
  - id: yuva-doldur
    verb: COMPOSE
    needs:
      [
        metin-uret,
        sablon-uyarla,
        gorsel-uret,
        gorsel-kirp,
        gorsel-uret-2,
        gorsel-kirp-2,
        gorsel-uret-3,
        gorsel-kirp-3,
        gorsel-uret-4,
        gorsel-kirp-4,
      ]
    constraints:
      katalog: true

  # 7) RENDER — TEK GENİŞ TUVAL, sonra dilimleme. Denetim aynı adımda koşuyor: ayrı bir
  # fiil dokuz fiil yasasını delerdi, ayrı bir adım render'ı iki kez koştururdu.
  - id: render
    verb: RENDER
    needs: [yuva-doldur]
    constraints:
      width: 1080
      height: 1350

  # 8) AGENT ÇIKTIYA BAKIYOR. `render`ın ölçtüğü şey kutular; bu adımın gördüğü şey
  # kompozisyon. İkisi ayrı sorular.
  # ⚠ **TASARIM KAPISI — slaytlar çizildi, yargı ve düzeltme turu HENÜZ koşmadı.**
  # Burada durmak, insanın tasarımı kendi gözüyle görüp devam demesini sağlıyor;
  # makinenin estetik puanı insanın bakışının yerine geçmiyor (D-279).
  - id: gorsel-yargi
    gate: tasarim-onayi
    verb: GENERATE
    capability: image.critique
    needs: [render]

  - id: tasarim-yargi
    verb: GENERATE
    capability: design.critique
    needs: [render]

  # 9) DÜZELTME TURU — denetimin ölçtüğü kusurları METİNLE kapat.
  #
  # ⚠ ⚠ **DAG DÖNGÜ TAŞIMIYOR, o yüzden tur AÇILARAK yazıldı.** `denetimTuru` kütüphane
  # düzeyinde iki tur destekliyor; hatta bir tur açıldı çünkü ikincisi altı adım daha
  # eklerdi ve ölçülen kazancı yok. Bir turdan sonra kalan kusur SUSTURULMUYOR: `kalite`
  # onu sayıyor ve insan onay kapısı görüyor.
  #
  # ⚠ **Kusur yoksa istem boş dönüyor ve adım atlanıyor** — zorla koşan bir düzeltme
  # turu, düzeltilecek şey olmadığında değişiklik üretir.
  - id: duzelt
    verb: GENERATE
    capability: text.generate
    needs: [render, sablon-uyarla]
    constraints:
      sablon_duzelt: true
      max_chars: 4000
      optional: true

  # 10) DÜZELTİLMİŞ BELGE ve SON RENDER. `duzelt` atlandıysa girdilerdeki en son uyarlama
  # hâlâ ilk yazımdır: aynı belge yeniden kuruluyor ve render birebir aynı çıkıyor.
  # Bedeli yerel bir render (bedava, saniyeler); kazancı tek bir çıkış noktası.
  - id: kompozit-son
    verb: COMPOSE
    needs:
      [
        metin-uret,
        sablon-uyarla,
        gorsel-uret,
        gorsel-kirp,
        gorsel-uret-2,
        gorsel-kirp-2,
        gorsel-uret-3,
        gorsel-kirp-3,
        gorsel-uret-4,
        gorsel-kirp-4,
        duzelt,
      ]
    constraints:
      katalog: true

  - id: render-son
    verb: RENDER
    needs: [kompozit-son]
    constraints:
      width: 1080
      height: 1350

  - id: kalite
    verb: VALIDATE
    needs: [render-son, gorsel-yargi, tasarim-yargi, gorsel-uret]

  - id: onay
    verb: PROPOSE
    needs: [kalite]
    gate: insan-onayi

  - id: yayinla
    verb: PUBLISH
    needs: [onay]
    constraints:
      platform: instagram
