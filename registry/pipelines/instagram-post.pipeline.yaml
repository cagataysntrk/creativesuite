# Instagram tek görsel postu (§10).
#
# MODEL ADI YOK (R-40): adımlar YETENEK ister, hangi modelin koşacağı yönlendiricinin
# kararıdır. Model ID'si burada olsaydı, o sağlayıcı öldüğü gün pipeline kırılırdı.
id: instagram-post
title: Instagram tek görsel postu

steps:
  - id: cozumle
    verb: RESOLVE

  - id: bilgi-sec
    verb: SELECT
    needs: [cozumle]

  - id: metin-uret
    verb: GENERATE
    capability: text.generate
    needs: [bilgi-sec]
    constraints:
      locale: tr-TR
      max_chars: 2200

  # Görsel prompt'unu MODEL yazar, hat dosyası değil (D-241 · D-243). Sabit bir prompt
  # içeriğe kör bir görsel verir; Türkçe konuyu doğrudan görsel modeline vermek ise
  # ölçülerek elendi. Brief İngilizce, insansız ve metinsiz isteniyor — R-20 ve 9. yasa
  # kapıları yine de bu metnin üzerinden geçiyor.

  # ⚠ **KOMPOZİT ARTIK GÖRSELDEN ÖNCE — hattın en önemli sıra değişikliği (FAZ-14.3).**
  # Eskiden `gorsel-brief` `bilgi-sec`ten besleniyor ve `gorsel-uret` `kompozit`ten ÖNCE
  # koşuyordu. Yani görsel, gireceği slaydı GÖRMEDEN doğuyordu: hangi satırın yanında
  # duracağını, yayda hangi işlevi taşıdığını, hatta gerçekten gerekip gerekmediğini
  # bilmiyordu. Brief KONUDAN yazılıyordu — oysa bir görselin desteklemesi gereken şey
  # konu değil, yanında duracağı O CÜMLE. FAZ-10.7'de "dikdörtgen fotoğraf" diye
  # yamadığım kusur sınıfının kökü buydu (D-261).
  #
  # Yeni sıra: metin → **kompozit (taban + tasarım planı)** → brief (yuvayı görerek) →
  # görsel (yalnız yuva varsa) → **yuva-doldur** → render.
  - id: kompozit
    verb: COMPOSE
    needs: [metin-uret]
    constraints:
      # Yuva bir POLİTİKA kararı: fotoğraf varsayılan olmaktan çıktı (D-261), ama bu
      # hat hâlâ akışsız konularda bir fotoğraf yuvası istiyor. Kompozisyon aileleri
      # geldiğinde (FAZ-12.7) bu kararı aile verecek.
      gorsel_yuvasi: true

  - id: gorsel-brief
    verb: GENERATE
    capability: text.generate
    # `kompozit`e bağlı: tasarım planı olmadan yuva bilinmez, yuva bilinmeden brief
    # yazılmaz. Bağ koparsa `gorselBriefPromptu` `null` döner ve zincir SESSİZCE sönerdi
    # — bu yüzden testi var.
    needs: [bilgi-sec, kompozit]
    constraints:
      gorsel_brief: true
      max_chars: 600
      # ⚠ **OPSİYONEL: düşmesi hattı DURDURMAZ** (FAZ-14.5). Fotoğraf varsayılan
      # olmaktan çıktı (D-261) ve taşıyıcı öge değil — *"bedava ve premium çıktı
      # tipografide aynıdır"* (§8.2). Bir görsel üretilemezse slayt diyagram, ikon ve
      # tipografiyle tam bir çıktı verir; koşuyu öldürmesi orantısız olurdu.
      # Motor tahmin etmiyor: isteğe bağlılık burada AÇIKÇA yazılı.
      optional: true

  # ⚠ **KOŞULLU: plan yuva işaretlemediyse bu adım model ÇAĞIRMAZ.** Koşucuya "adım
  # atla" yeteneği eklenmedi; `gorselBriefPromptu` yuva yokken `null` dönüyor, brief
  # üretilmiyor ve bu adım besinsiz kalıyor. *"Her ihtimale karşı bir görsel üret"*
  # tam olarak D-261'in kusuruydu: hem kota hem marka tutarlılığı kaybı.
  - id: gorsel-uret
    verb: GENERATE
    capability: image.generate
    needs: [gorsel-brief]
    constraints:
      # Brief gibi opsiyonel: sağlayıcı düşerse, kota biterse ya da çıktı R-20'ye
      # takılırsa karosel yine tam çıkar. Ret defterde `errors` altında KALIR —
      # sessizce yutulan ret, olmayan rettir (D-256).
      optional: true
      aspect: '4:5'
      # Görsel modeline Türkçe metin çizdirilmez (R-20) — metin kompozitte gelir.
      no_text: true
      max_cost_usd_micros: 20000

  # Yuvaya oturtma AYNI `composeBody` ile yapılıyor: görsel artık girdide olduğu için
  # aynı gövde onu yerleştiriyor. Yeni bir fiil de yeni bir gövde de gerekmedi —
  # `metin-uret`/`gorsel-brief` ikilisinin `text.generate`i paylaşması gibi.
  - id: yuva-doldur
    verb: COMPOSE
    needs: [metin-uret, kompozit, gorsel-uret]
    constraints:
      # Aynı politika: iki compose adımı AYNI planı üretmeli, yoksa denetim (14.4)
      # her koşuda sapma raporlar.
      gorsel_yuvasi: true

  - id: render
    verb: RENDER
    # Yetenek YOK: render YÖNLENDİRİLMEZ. R-30 tek motor diyor ve bir motoru "seçmek",
    # ikinci bir motorun var olabileceğini varsayar (D-122).
    needs: [yuva-doldur]
    constraints:
      width: 1080
      height: 1350

  # Görsel yargı ölçülemeyeni ölçüyor: `tasarim` kapısı taşmayı ve kontrastı sayıyor,
  # ama "tırnak çerçeve tepesinde kırpılmış" gibi kusurlar ancak BAKINCA görülüyor.
  # `kalite`den ÖNCE koşuyor ki bulgular tolerans raporuna girebilsin.
  - id: gorsel-yargi
    verb: GENERATE
    capability: image.critique
    needs: [render]

  - id: kalite
    verb: VALIDATE
    needs: [render, gorsel-yargi]

  - id: onay
    verb: PROPOSE
    needs: [kalite]
    gate: insan-onayi

  # ⚠ FAZ-7 denetimi 2. tur (B1): `PUBLISH` fiil haritasındaydı ama **hiçbir hat onu
  # çağırmıyordu** — `grep -rn PUBLISH registry/` sıfır satır veriyordu. D-216'nın
  # (`INGEST`) dersi bir seviye yukarıda tekrarladı: gövde yazıldı, harita dolduruldu,
  # HATTI yazan olmadı. "Çağıran var mı" sorusu tek adım için değil, ZİNCİR için
  # sorulmalı.
  #
  # `needs: [onay]` — yayın **onaydan sonra**. Kapı geçilmediyse bu adım hiç koşmaz;
  # insan onayı bir yan etki değil, bir kapıdır (§4.1b).
  - id: yayinla
    verb: PUBLISH
    needs: [onay]
    constraints:
      platform: instagram
