# Headless Claude Code — akıl gerektiren adımların sağlayıcısı (D-8).
#
# Adaptörü FAZ-1.14'te yazıldı ve KOŞUYOR. Tanımlayıcı veridir: fiyat, yetenek ve
# kısıtlar burada; onunla konuşma biçimi `packages/providers/src/claude-code.ts`te.
id: claude-code
title: Claude Code (headless)
adapter: claude-code
enabled: true

# Mevcut abonelik kullanılıyor, ekstra API faturası YOK — bu yüzden maliyet formülü
# sıfır ve `estimate()` sıfır aralık döndürüyor. "Bedava" değil, ZATEN ÖDENMİŞ.
cost_formula: '0'
pricing_snapshot: null

# Bedava katman lisansı (§7.5 · FAZ-5.4). Burada "bedava katman" YOK: kullanılan şey
# ödenmiş bir abonelik ve ticari kullanım o aboneliğin şartlarından geliyor. Şerit adı
# `free` çünkü ÇALIŞTIRMAYA ek fatura çıkarmıyor — lisans sorusu ayrı ve cevabı evet.
free_tier_commercial: true

# Kimlik ortamdan gelir; ADI yazılır, DEĞERİ asla (R-51).
auth_env: null

capabilities:
  # Görsel yargı (FAZ-10.5 · D-256). Claude Code görseli KENDİ okuyor: prompt mutlak
  # yolu taşıyor, adaptörün ikili veri taşımasına gerek yok. Ücretsiz şerit — abonelik
  # zaten var ve yargı her koşuda çalışacak; premium bir yargı, kapanın maliyetini
  # üretimin maliyetine yaklaştırırdı.
  - name: image.critique
    lanes: [free]
    supports:
      locale: ['tr-TR']
  # Estetik yargı (FAZ-13.5). `image.critique` KUSUR arar, bu yetenek İYİ arar; ikisi
  # ayrı çünkü `kalite` kapısı kabul edilemezi eler, estetik yargı tercih edileni sorar.
  # Karışsalardı ya kapı öznelleşirdi ya estetik zorunlu olurdu.
  - name: design.critique
    lanes: [free]
    supports:
      locale: ['tr-TR']
  - name: text.generate
    lanes: [free]
    supports:
      locale: ['tr-TR', 'en-US']
      max_chars: [2200, 3000, 10000]
