# Cloudflare Workers AI — görsel üretimi (bedava şerit).
#
# Bedava katman ticari kullanıma açık ve günlük nöron kotasıyla sınırlı. `free` şeridin
# varsayılanı bu; `free` içinde ucuz/orta model seçimi yönlendiricinin işidir, üçüncü
# bir şerit değil (D-2).
#
# ✅ `enabled: true` (2026-08-16): anahtarlar kasada ve GERÇEK çağrı ölçüldü —
# HTTP 200, 1024x1024 JPEG, metinsiz. Cassette değil, gerçek uç nokta.
#
# ⚠ ⚠ **MODEL DEĞİŞTİ (2026-08-28): `flux-2-klein-4b`.** Depo sahibi *"üretilen
# görseller aşırı kalitesiz"* dedi; altı model yarıştırıldı ve şikâyet doğrulandı —
# eski `sdxl-lightning` kadran çevresine UYDURMA HARFLER çiziyor ve kadrajı kenardan
# kenara dolduruyordu. Gerekçenin tamamı fiyat anlık görüntüsünde.
# ⚠ V-14 açık: kota AŞIMI davranışı hesabın planına bağlı ve ölçülmedi.
id: cloudflare-workers-ai
title: Cloudflare Workers AI (bedava şerit)
adapter: cloudflare-workers-ai
enabled: true

# Bedava katman: sıfır. Bu sıfır bir BİLGİSİZLİK değil bir OLGU — `unreported` ile
# ayrımı tam olarak bu (§8.3). Kota aşımının nasıl faturalandığı ayrı bir soru (V-14).
cost_formula: '0'
pricing_snapshot: _pricing/cloudflare-2026-08-28.json

# Bedava katman TİCARİ kullanıma açık (§7.5 · FAZ-5.4) — bu dosyanın başındaki
# gerekçenin makine-okunur hâli. Beyan olmadan bedava şerit kullanılamaz.
free_tier_commercial: true

auth_env: CF_API_TOKEN

capabilities:
  - name: image.generate
    # ⚠ İki şerit: premium bir koşuda ücretli sağlayıcı düşerse yönlendiricinin
    # düşebileceği bir aday kalsın. Premium "para harcamak zorunlu" demek değil.
    lanes: [free, premium]
    supports:
      aspect: ['1:1', '4:5', '9:16', '16:9']
      no_text: [true]
