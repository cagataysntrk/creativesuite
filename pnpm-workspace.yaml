# Halkalar = paketler. Bağımlılık yönü tek yönlü ve üç mekanizmayla zorlanır:
#   contracts ← kernel ← {registry, corpus, providers, render} ← engine ← {server, cli}
#   ui → contracts (yalnız)
# Aynı katmandaki paketler birbirini import ETMEZ (kardeş yasağı, FAZ-1.1).
packages:
  - 'packages/*'
  - 'apps/*'

# ── ayarlar ──────────────────────────────────────────────────────────────────
# DİKKAT: pnpm 11 bu ayarları `.npmrc`'den OKUMAZ; tek geçerli yer burasıdır.
# Önceden `.npmrc`'de duruyorlardı ve beşi de sessizce etkisizdi (D-54).
# Doğrulama: `pnpm config get hoist` → false döndürmeli, `undefined` değil.

# Bağımlılıklar TAM sürüme sabitlenir — aralık yok.
# Gerekçe: "bir ay ihmal edilse de çalışır" (değişmez ilke 12). Bir caret aralığı,
# dokunulmamış bir repoda sessizce farklı kod çalıştırır.
saveExact: true

# Node sürümü package.json engines ile uyuşmuyorsa kur reddedilir.
engineStrict: true

# Phantom bağımlılık yok: bir paket, package.json'ında yazmadığı hiçbir şeyi import edemez.
# Halka sınırlarını (D-29) dosya sistemi seviyesinde de zorlar — TS ve lint'ten bağımsız
# dördüncü bir katman.
hoist: false
strictPeerDependencies: true

# Kurulum betikleri varsayılan olarak çalışmaz; izin verilenler açıkça listelenir.
enablePrePostScripts: false

# Kurulum betiği izinleri. `false` = bilerek REDDEDİLDİ, unutulmuş değil.
# msw'nin postinstall'ı tarayıcı service worker'ını kurar; biz onu yalnız Node'da
# tek HTTP kesici olarak kullanıyoruz (§15) — tarayıcı tarafı hiç doğmadı.
allowBuilds:
  msw: false
  # Yerel derleme gerekebilir (prebuild yoksa node-gyp). Süre ve kırılganlık burada ölçülüyor.
  better-sqlite3: true
  # ⚠ Bu dördü `set this to true or false` yer tutucusuyla duruyordu ve pnpm temiz
  # bir klonda kurulumu REDDEDİYORDU (`ERR_PNPM_IGNORED_BUILDS`). Geliştirme
  # makinesinde fark edilmedi çünkü store zaten doluydu; **geri yükleme tatbikatı
  # buldu** (FAZ-8.7). Karar verilmemiş bir ayar, karar verilmiş sayılmaz.
  #
  # Dördü de `false`: bu dört kurulum betiği 189 commit boyunca ATLANDI ve testler,
  # kapılar, render hattı çalıştı. Kanıt bu — "belki gerekir" değil.
  '@google/genai': false # REST istemcisi; postinstall'ı yalnız telemetri/binary indirir
  esbuild: false # platform ikilisi optionalDependencies ile geliyor, betiğe gerek yok
  onnxruntime-node: false # yerel ONNX çalıştırma hattı HİÇ kurulmadı (FAZ 5 yerel TTS ertelendi)
  protobufjs: false # postinstall kod üretiyor; bizim çağırdığımız yüzeyde kullanılmıyor
