name: Dima Decision Room Film
on:
  push:
    branches: [work/dima-decision-room-film]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install media deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet numpy
          mkdir -p motion/dima-decision-room/assets
          cp brand/brd_upcytech/logo/isaret-acik.png motion/dima-decision-room/assets/upcy.png
      - name: Build soundtrack
        working-directory: motion/dima-decision-room
        run: python make_music.py
      - name: HyperFrames lint
        working-directory: motion/dima-decision-room
        run: npx --yes hyperframes@0.7.109 lint
      - name: HyperFrames validate
        working-directory: motion/dima-decision-room
        run: npx --yes hyperframes@0.7.109 validate
      - name: HyperFrames inspect
        working-directory: motion/dima-decision-room
        run: npx --yes hyperframes@0.7.109 inspect
      - name: QA snapshots
        working-directory: motion/dima-decision-room
        run: npx --yes hyperframes@0.7.109 snapshot --at 1.5,4.8,8.9,13.4,18.1,22.3
      - name: Render
        working-directory: motion/dima-decision-room
        run: npx --yes hyperframes@0.7.109 render --fps 30 --quality high --player-ready-timeout 2000 --output silent.mp4
      - name: Mux audio and preview
        working-directory: motion/dima-decision-room
        run: |
          ffmpeg -y -loglevel error -i silent.mp4 -i assets/score.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 256k -shortest -movflags +faststart Dima_Decision_Room_1080x1920.mp4
          ffmpeg -y -loglevel error -i Dima_Decision_Room_1080x1920.mp4 -vf "fps=10,scale=360:-2:flags=lanczos,split[a][b];[a]palettegen=max_colors=96[p];[b][p]paletteuse=dither=bayer" -t 8 preview.gif
          ffprobe -v error -show_entries format=duration,size,bit_rate -of json Dima_Decision_Room_1080x1920.mp4 > render-info.json
      - uses: actions/upload-artifact@v4
        with:
          name: dima-decision-room-film
          path: |
            motion/dima-decision-room/Dima_Decision_Room_1080x1920.mp4
            motion/dima-decision-room/preview.gif
            motion/dima-decision-room/snapshots/
            motion/dima-decision-room/index.html
            motion/dima-decision-room/storyboard.json
            motion/dima-decision-room/music-meta.json
            motion/dima-decision-room/render-info.json
          if-no-files-found: error
          retention-days: 30
