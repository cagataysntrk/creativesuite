name: Chat-controlled carousel render

on:
  pull_request:
    paths:
      - "ci/chat-jobs/**"
  push:
    branches:
      - main
      - "work/**"
    paths:
      - "ci/chat-jobs/**"
  workflow_dispatch:
    inputs:
      job_dir:
        description: "ci/chat-jobs/<job-id>"
        required: true
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate

      - name: Resolve pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm exec tsc -b

      - name: Resolve job directories
        id: jobs
        shell: bash
        env:
          MANUAL_JOB_DIR: ${{ inputs.job_dir }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : > /tmp/jobs.txt

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            printf '%s\n' "${MANUAL_JOB_DIR}" >> /tmp/jobs.txt
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- 'ci/chat-jobs/**/panorama.json' |
              sed 's#/panorama.json$##' >> /tmp/jobs.txt
          else
            git diff --name-only "${BEFORE}" "${SHA}" -- 'ci/chat-jobs/**/panorama.json' |
              sed 's#/panorama.json$##' >> /tmp/jobs.txt
          fi

          sort -u /tmp/jobs.txt -o /tmp/jobs.txt
          if [[ ! -s /tmp/jobs.txt ]]; then
            echo "Render edilecek panorama.json bulunamadı." >&2
            exit 1
          fi

          while IFS= read -r dir; do
            [[ "${dir}" =~ ^ci/chat-jobs/[a-z0-9][a-z0-9-]{2,63}$ ]] || {
              echo "Geçersiz job dizini: ${dir}" >&2
              exit 1
            }
            [[ -f "${dir}/panorama.json" ]] || {
              echo "panorama.json yok: ${dir}" >&2
              exit 1
            }
          done < /tmp/jobs.txt

          {
            echo 'dirs<<EOF'
            cat /tmp/jobs.txt
            echo EOF
          } >> "${GITHUB_OUTPUT}"

      - name: Render and mechanical QA
        shell: bash
        env:
          JOB_DIRS: ${{ steps.jobs.outputs.dirs }}
        run: |
          set -euo pipefail
          mkdir -p .chat-artifacts
          while IFS= read -r dir; do
            [[ -n "${dir}" ]] || continue
            id="$(basename "${dir}")"
            node scripts/chat-carousel-render.mjs "${dir}" ".chat-artifacts/${id}"
          done <<< "${JOB_DIRS}"

      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chat-carousel-${{ github.run_id }}
          path: .chat-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Chat-controlled CreativeSuite render"
            echo
            echo "- GitHub runner: hosted Ubuntu; kullanıcının bilgisayarına bağlı değil."
            echo "- LLM/API/provider çağrısı: yok."
            echo "- Zekâ ve revizyon kararı: ChatGPT oturumu."
            echo "- Render: CreativeSuite'in kendi Chromium panorama motoru."
            echo "- Yayın: yok."
          } >> "${GITHUB_STEP_SUMMARY}"
