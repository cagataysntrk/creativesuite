name: CreativeSuite JUST preview
on:
  push:
    branches: [feat/just-chat-preview]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  just-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUITE_CHAT_HANDOFF: ${{ github.workspace }}/ci/just-preview/oee/handoff.json
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_HESAPLAR: ${{ secrets.CF_HESAPLAR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate
      - name: just
        uses: extractions/setup-just@v2
      - name: install
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: JUST URET
        run: just uret instagram-karosel-chat-preview "OEE düştüğünde aslında neyi araştırmalısınız?" --sablon sahne --icerik-kipi genel
      - name: collect
        shell: bash
        run: |
          set -euo pipefail
          RUN_DIR="$(find derived/runs -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          mkdir -p .just-preview
          cp "${RUN_DIR}"/slayt-*.jpg .just-preview/ 2>/dev/null || true
          cp "${RUN_DIR}/panorama.json" .just-preview/ 2>/dev/null || true
          cp "${RUN_DIR}/manifest.json" .just-preview/
          cp -r "${RUN_DIR}/steps" .just-preview/steps
      - uses: actions/upload-artifact@v4
        with:
          name: oee-just-preview-${{ github.run_id }}
          path: .just-preview/
          if-no-files-found: error
          retention-days: 14
